# Project-wide Gradle settings.

# Specifies the JVM arguments used for the daemon process.
# High performance allocation: 4GB heap, parallel garbage collector, 1GB metaspace.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC

# Speed optimizations: parallel execution, daemon reuse, and task output caching
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.configureondemand=true

# Kotlin incremental compilation for faster builds
kotlin.incremental=true

# AndroidX package structure
android.useAndroidX=true

# Target release architectures (64-bit and 32-bit ARM for physical devices, x86/x86_64 for emulators)
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# New Architecture (TurboModules & Fabric)
newArchEnabled=true

# Hermes JS engine (optimized bytecode for ultra-fast startup and smaller APK)
hermesEnabled=true

# Edge-to-edge display support
edgeToEdgeEnabled=true

# Opt out of built-in kotlin and new DSL behavior that ships with AGP 9.
android.builtInKotlin=false
android.newDsl=false

